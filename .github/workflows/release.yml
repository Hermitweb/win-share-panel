name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 不指定 version：读取 package.json 的 packageManager（pnpm@9.12.0），
        # 与 ci.yml、本地、lockfile v9.0 保持单一真相源（audit E-2 版本漂移修复）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 满足 package.json engines.node >=20；与 ci.yml 一致
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # lockfile 与 package.json 一致（E1-E4 已对齐），发布构建强制可重现安装（audit E-11）
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & Package (electron-vite + electron-builder，三架构)
        run: pnpm build:win
        env:
          # EP_PUBLISH=never: 禁用 electron-builder 自动发布（CI 检测到 GH_TOKEN 会
          # 自动上传产物，与下方 softprops 上传步骤叠加产生重复资产），
          # 统一由下方 "Upload artifacts" 步骤负责上传。
          # 另：`--publish never` 也已写进 scripts/build-win.mjs（双保险）——
          # v1.2.0 的 Release 运行正是只设了 EP_PUBLISH、electron-builder 仍尝试发布，
          # 报 "GitHub Personal Access Token is not set" 而失败。
          EP_PUBLISH: never
          # 镜像必须设 npm_config_* 形式：@electron/get 的取值优先级为
          #   npm_config_electron_mirror > npm_package_config_electron_mirror > ELECTRON_MIRROR > 默认值
          # 而仓库 .npmrc 的 `electron_mirror` 会被 pnpm 导出成 npm_config_electron_mirror，
          # **优先级高于** ELECTRON_MIRROR —— 只设后者挡不住镜像。v1.3.0 首次发布即因此
          # 从 npmmirror 拉 arm64 Electron（境外慢 + 本次包不完整），arm64 打包失败。
          # runner 在境外，直连官方源更快更可靠。
          #
          # v1.4.1 修正：两类镜像必须分开指，不能一刀切全官方源——
          # ① Electron 本体（electron_mirror）→ 官方 GitHub：v1.3.0 踩过的坑
          #    （npmmirror 的 arm64 包不完整），保持官方源不变；
          # ② electron-builder-binaries（winCodeSign 等构建工具）→ npmmirror：
          #    官方源的 winCodeSign-2.6.0.7z 返回 404（上游 release 资产缺失，
          #    2026-10-17 实测），而 npmmirror 的 electron-builder-binaries 镜像
          #    完整收录该文件（registry.npmmirror.com/-/binary 200 验证通过）。
          #    构建工具类资产走国内镜像反而更稳，不受上游 GitHub release 清理影响。
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Verify artifacts（三架构产物齐备）
        shell: pwsh
        run: |
          Write-Host "=== release artifacts ==="
          if (-not (Test-Path release)) {
            Write-Host "ERROR: release directory not found"
            exit 1
          }
          Get-ChildItem release -File | Sort-Object Name | Select-Object Name, Length | Format-Table -AutoSize

          # 三架构的 Setup 必须都在；MSI 只有 x86/x64（arm64 无 MSI，理由见 electron-builder.yml）
          $missing = @()
          foreach ($arch in 'x86', 'x64', 'arm64') {
            if (-not (Get-ChildItem release -Filter "*-Setup-$arch.exe" -ErrorAction SilentlyContinue)) {
              $missing += "Setup-$arch.exe"
            }
            if (-not (Get-ChildItem release -Filter "*-portable-$arch.exe" -ErrorAction SilentlyContinue)) {
              $missing += "portable-$arch.exe"
            }
          }
          foreach ($arch in 'x86', 'x64') {
            if (-not (Get-ChildItem release -Filter "*-$arch.msi" -ErrorAction SilentlyContinue)) {
              $missing += "$arch.msi"
            }
          }
          if (-not (Test-Path release/SHA256SUMS.txt)) { $missing += 'SHA256SUMS.txt' }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: 缺少产物: $($missing -join ', ')"
            exit 1
          }
          # 架构标识与内容的硬校验在 scripts/build-win.mjs 内完成（读解包主程序 PE Machine，
          # 0x14c=x86 / 0x8664=x64 / 0xaa64=arm64，不一致即该步构建失败），此处只核对文件名齐备
          Write-Host "=== SHA256SUMS.txt ==="
          Get-Content release/SHA256SUMS.txt

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wpf-release:
    # WPF .NET 10 壳发布：self-contained（免装运行时，兼容面 = 打包面）+ ReadyToRun 启动提速。
    # win-x64 为主力 SKU；arm64 待有真机验证后再加。产物命名对齐 Electron 惯例
    # （项目名-版本-平台-架构-格式，无 wpf 标注），版本取自 csproj <Version>（与
    # package.json 同步维护），zip 挂同一 Release。
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WPF (self-contained win-x64 + ReadyToRun)
        id: pack
        # 直接 publish csproj（不经 slnx）：规避 MSB4126（环境变量 Platform=x64 时
        # slnx 的显式 Any CPU/x64 平台声明会构建失败——见 WinShare.slnx 注释）
        run: dotnet publish net/WinShare.App/WinShare.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o net/WinShare.App/publish

      - name: Read WPF version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content net/WinShare.App/WinShare.App.csproj)).Project.PropertyGroup.Version |
                     Select-Object -First 1
          if (-not $version) { Write-Host 'ERROR: csproj <Version> 未声明'; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "WPF version=$version"

      - name: Zip WPF artifacts
        shell: pwsh
        run: |
          $zip = "release/WinShare.Panel-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path 'net/WinShare.App/publish/*' -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload WPF artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/WinShare.Panel-${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: false   # Release notes 由 Electron job 生成，避免重复
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
