name: Release

on:
  push:
    tags:
      - 'v*' # Electron 统一 Release（WinShare.Panel-{version}-Setup/portable/msi）
      - 'wpf-v*' # WPF 独立 Release（WinShare.Panel-{version}-win-x64.zip；版本线 2.x 起）
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    # Electron 专用：wpf-v* tag 只走 wpf-release（双版本线互不干扰）
    if: ${{ !startsWith(github.ref, 'refs/tags/wpf-') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 不指定 version：读取 package.json 的 packageManager（pnpm@9.12.0），
        # 与 ci.yml、本地、lockfile v9.0 保持单一真相源（audit E-2 版本漂移修复）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 满足 package.json engines.node >=20；与 ci.yml 一致
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # lockfile 与 package.json 一致（E1-E4 已对齐），发布构建强制可重现安装（audit E-11）
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & Package (electron-vite + electron-builder，三架构)
        run: pnpm build:win
        env:
          # EP_PUBLISH=never: 禁用 electron-builder 自动发布（CI 检测到 GH_TOKEN 会
          # 自动上传产物，与下方 softprops 上传步骤叠加产生重复资产），
          # 统一由下方 "Upload artifacts" 步骤负责上传。
          # 另：`--publish never` 也已写进 scripts/build-win.mjs（双保险）——
          # v1.2.0 的 Release 运行正是只设了 EP_PUBLISH、electron-builder 仍尝试发布，
          # 报 "GitHub Personal Access Token is not set" 而失败。
          EP_PUBLISH: never
          # 镜像必须设 npm_config_* 形式：@electron/get 的取值优先级为
          #   npm_config_electron_mirror > npm_package_config_electron_mirror > ELECTRON_MIRROR > 默认值
          # 而仓库 .npmrc 的 `electron_mirror` 会被 pnpm 导出成 npm_config_electron_mirror，
          # **优先级高于** ELECTRON_MIRROR —— 只设后者挡不住镜像。v1.3.0 首次发布即因此
          # 从 npmmirror 拉 arm64 Electron（境外慢 + 本次包不完整），arm64 打包失败。
          # runner 在境外，直连官方源更快更可靠。
          #
          # v1.4.1 修正：两类镜像必须分开指，不能一刀切全官方源——
          # ① Electron 本体（electron_mirror）→ 官方 GitHub：v1.3.0 踩过的坑
          #    （npmmirror 的 arm64 包不完整），保持官方源不变；
          # ② electron-builder-binaries（winCodeSign 等构建工具）→ npmmirror：
          #    官方源的 winCodeSign-2.6.0.7z 返回 404（上游 release 资产缺失，
          #    2026-10-17 实测），而 npmmirror 的 electron-builder-binaries 镜像
          #    完整收录该文件（registry.npmmirror.com/-/binary 200 验证通过）。
          #    构建工具类资产走国内镜像反而更稳，不受上游 GitHub release 清理影响。
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Verify artifacts（三架构产物齐备）
        shell: pwsh
        run: |
          Write-Host "=== release artifacts ==="
          if (-not (Test-Path release)) {
            Write-Host "ERROR: release directory not found"
            exit 1
          }
          Get-ChildItem release -File | Sort-Object Name | Select-Object Name, Length | Format-Table -AutoSize

          # 三架构的 Setup 必须都在；MSI 只有 x86/x64（arm64 无 MSI，理由见 electron-builder.yml）
          $missing = @()
          foreach ($arch in 'x86', 'x64', 'arm64') {
            if (-not (Get-ChildItem release -Filter "*-Setup-$arch.exe" -ErrorAction SilentlyContinue)) {
              $missing += "Setup-$arch.exe"
            }
            if (-not (Get-ChildItem release -Filter "*-portable-$arch.exe" -ErrorAction SilentlyContinue)) {
              $missing += "portable-$arch.exe"
            }
          }
          foreach ($arch in 'x86', 'x64') {
            if (-not (Get-ChildItem release -Filter "*-$arch.msi" -ErrorAction SilentlyContinue)) {
              $missing += "$arch.msi"
            }
          }
          if (-not (Test-Path release/SHA256SUMS.txt)) { $missing += 'SHA256SUMS.txt' }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: 缺少产物: $($missing -join ', ')"
            exit 1
          }
          # 架构标识与内容的硬校验在 scripts/build-win.mjs 内完成（读解包主程序 PE Machine，
          # 0x14c=x86 / 0x8664=x64 / 0xaa64=arm64，不一致即该步构建失败），此处只核对文件名齐备
          Write-Host "=== SHA256SUMS.txt ==="
          Get-Content release/SHA256SUMS.txt

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wpf-release:
    # WPF .NET 10 壳独立发版（wpf-v* tag 专属；v* tag 走 Electron job）：三架构全矩阵。
    # 版本线 2.x 起，与 Electron（package.json 1.5.x）解耦；产物命名对齐 Electron 惯例：
    #   WinShare.Panel-{version}-win-{label}.zip          自包含目录 zip（解压即用）
    #   WinShare.Panel-{version}-portable-{label}.exe     单文件 portable（双击即用）
    #   WinShare.Panel-{version}-Setup-{label}.exe        Inno Setup 安装包
    # 版本取自 csproj <Version>（wpf-v* tag 发版时手动 bump）。
    if: ${{ startsWith(github.ref, 'refs/tags/wpf-') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: x64, rid: win-x64, inno64: x64 }
          - { label: x86, rid: win-x86, inno64: none }
          - { label: arm64, rid: win-arm64, inno64: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        # 安装包工具链：runner 不预装，走 chocolatey（ISCC 在 Program Files (x86)\Inno Setup 6）
        run: choco install innosetup --yes --no-progress

      - name: Read WPF version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content net/WinShare.App/WinShare.App.csproj)).Project.PropertyGroup.Version |
                     Select-Object -First 1
          if (-not $version) { Write-Host 'ERROR: csproj <Version> 未声明'; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "WPF ${{ matrix.label }} version=$version"

      - name: Publish self-contained folder (${{ matrix.label }})
        # 直接 publish csproj（不经 slnx）：规避 MSB4126（环境变量 Platform=x64 时
        # slnx 的显式 Any CPU/x64 平台声明会构建失败——见 WinShare.slnx 注释）
        run: dotnet publish net/WinShare.App/WinShare.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Platform=AnyCPU -p:PublishReadyToRun=true -o publish/${{ matrix.label }}

      - name: Publish single-file portable (${{ matrix.label }})
        run: dotnet publish net/WinShare.App/WinShare.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Platform=AnyCPU -p:PublishReadyToRun=true -o publish-single/${{ matrix.label }}

      - name: Package (${{ matrix.label }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # wpf-release 是独立 runner：release/ 目录必须先建（v1.5.1 首跑即因此失败）
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $v = '${{ steps.version.outputs.version }}'
          $label = '${{ matrix.label }}'

          # ① 自包含 zip（解压即用）
          $zip = "release/WinShare.Panel-$v-win-$label.zip"
          Compress-Archive -Path "publish/$label/*" -DestinationPath $zip -Force

          # ② 单文件 portable（双击即用）
          $portable = "release/WinShare.Panel-$v-portable-$label.exe"
          Copy-Item "publish-single/$label/WinShare.App.exe" $portable -Force

          # ③ Inno Setup 安装包
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { Write-Host "ERROR: ISCC 不存在: $iscc"; exit 1 }
          $isccArgs = @(
            "/DAppVersion=$v",
            "/DArch=${{ matrix.inno64 }}",
            "/DArchLabel=$label",
            "/DPublishDir=$PWD/publish/$label",
            "/DOutputDir=$PWD/release",
            "/DIconFile=$PWD/resources/icon.ico",
            'net/WinShare.App/installer/wpf.iss'
          )
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { Write-Host 'ERROR: ISCC 编译失败'; exit 1 }

          # ④ 本架构 SHA256SUMS（对齐 Electron 的 sums 惯例；矩阵并行上传故按架构命名）
          $sums = "release/SHA256SUMS-$label.txt"
          Get-Item $zip, $portable, "release/WinShare.Panel-$v-Setup-$label.exe" | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -FilePath $sums -Encoding utf8NoBOM

          Get-ChildItem release -Filter "*$label*" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload WPF artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WinShare Panel WPF ${{ steps.version.outputs.version }}
          files: |
            release/WinShare.Panel-${{ steps.version.outputs.version }}-win-${{ matrix.label }}.zip
            release/WinShare.Panel-${{ steps.version.outputs.version }}-portable-${{ matrix.label }}.exe
            release/WinShare.Panel-${{ steps.version.outputs.version }}-Setup-${{ matrix.label }}.exe
            release/SHA256SUMS-${{ matrix.label }}.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
