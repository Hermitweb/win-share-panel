name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 不指定 version：读取 package.json 的 packageManager（pnpm@9.12.0），
        # 与 ci.yml、本地、lockfile v9.0 保持单一真相源（audit E-2 版本漂移修复）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 满足 package.json engines.node >=20；与 ci.yml 一致
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # lockfile 与 package.json 一致（E1-E4 已对齐），发布构建强制可重现安装（audit E-11）
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build & Package (electron-vite + electron-builder，三架构)
        run: pnpm build:win
        env:
          # EP_PUBLISH=never: 禁用 electron-builder 自动发布（CI 检测到 GH_TOKEN 会
          # 自动上传产物，与下方 softprops 上传步骤叠加产生重复资产），
          # 统一由下方 "Upload artifacts" 步骤负责上传。
          # 另：`--publish never` 也已写进 scripts/build-win.mjs（双保险）——
          # v1.2.0 的 Release 运行正是只设了 EP_PUBLISH、electron-builder 仍尝试发布，
          # 报 "GitHub Personal Access Token is not set" 而失败。
          EP_PUBLISH: never
          # 镜像必须设 npm_config_* 形式：@electron/get 的取值优先级为
          #   npm_config_electron_mirror > npm_package_config_electron_mirror > ELECTRON_MIRROR > 默认值
          # 而仓库 .npmrc 的 `electron_mirror` 会被 pnpm 导出成 npm_config_electron_mirror，
          # **优先级高于** ELECTRON_MIRROR —— 只设后者挡不住镜像。v1.3.0 首次发布即因此
          # 从 npmmirror 拉 arm64 Electron（境外慢 + 本次包不完整），arm64 打包失败。
          # runner 在境外，直连官方源更快更可靠。
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron/electron-builder-binaries/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron/electron-builder-binaries/releases/download/

      - name: Verify artifacts（三架构产物齐备）
        shell: pwsh
        run: |
          Write-Host "=== release artifacts ==="
          if (-not (Test-Path release)) {
            Write-Host "ERROR: release directory not found"
            exit 1
          }
          Get-ChildItem release -File | Sort-Object Name | Select-Object Name, Length | Format-Table -AutoSize

          # 三架构的 Setup 必须都在；MSI 只有 x86/x64（arm64 无 MSI，理由见 electron-builder.yml）
          $missing = @()
          foreach ($arch in 'x86', 'x64', 'arm64') {
            if (-not (Get-ChildItem release -Filter "*-Setup-$arch.exe" -ErrorAction SilentlyContinue)) {
              $missing += "Setup-$arch.exe"
            }
            if (-not (Get-ChildItem release -Filter "*-portable-$arch.exe" -ErrorAction SilentlyContinue)) {
              $missing += "portable-$arch.exe"
            }
          }
          foreach ($arch in 'x86', 'x64') {
            if (-not (Get-ChildItem release -Filter "*-$arch.msi" -ErrorAction SilentlyContinue)) {
              $missing += "$arch.msi"
            }
          }
          if (-not (Test-Path release/SHA256SUMS.txt)) { $missing += 'SHA256SUMS.txt' }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: 缺少产物: $($missing -join ', ')"
            exit 1
          }
          # 架构标识与内容的硬校验在 scripts/build-win.mjs 内完成（读解包主程序 PE Machine，
          # 0x14c=x86 / 0x8664=x64 / 0xaa64=arm64，不一致即该步构建失败），此处只核对文件名齐备
          Write-Host "=== SHA256SUMS.txt ==="
          Get-Content release/SHA256SUMS.txt

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
