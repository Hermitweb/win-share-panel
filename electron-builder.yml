appId: com.winshare.panel
productName: WinShare Panel
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
asar: true
extraResources:
  - from: resources
    to: resources
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64, ia32]
    - target: msi
      arch: [x64, ia32]
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  artifactName: ${productName}-${version}-Setup-${arch}.exe
portable:
  artifactName: ${productName}-${version}-portable-${arch}.exe
msi:
  oneClick: false
  artifactName: ${productName}-${version}-${arch}.msi
