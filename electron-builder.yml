appId: com.winshare.panel
productName: WinShare Panel
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  # out/ 是构建目录，历史上有人往里写过诊断日志（diagnose-test*.log），不该随包发布
  - '!out/**/*.log'
asar: true
# 体积优化：全部第三方依赖由 electron-vite 打进 out/（主进程/预加载实测只 require electron 与
# node 内置模块），因此它们都在 devDependencies。**不要**把 react/antd 一类搬回 dependencies：
# electron-builder 会把生产依赖整棵树塞进 app.asar —— 实测 6.51 MiB → 147.9 MiB，安装体积多 180+ MiB。
# Electron 自带 55 个语言包共 38.3MB，本应用界面是中文（英文备用），
# 实测只留 zh-CN + en-US 共 0.9MB → 每个架构少 37.4MB（见 docs/DEVELOPMENT.md §11.6）
electronLanguages:
  - zh-CN
  - en-US
extraResources:
  - from: resources
    to: resources
    filter: ['**/*']
win:
  # 三架构：x86(ia32) / x64 / arm64。
  # 这里的 arch 列表是「基线声明」；实际打包由 scripts/build-win.mjs 逐架构单独调用
  # electron-builder（避免多个 arch 落在同一次调用里产出「胖」安装包），
  # 命名里的架构标识由该脚本注入 WINSHARE_ARCH_LABEL（32 位对外写 x86，不写 Electron 的 ia32）。
  target:
    - target: nsis
      arch: [x64, ia32, arm64]
    - target: portable
      arch: [x64, ia32, arm64]
    - target: msi
      # arm64 不在这里：electron-builder 25 内置的 wix 4.0.0.5512.2 不支持 arm64，
      # 它会静默把 arm64 请求降级成 x64 MSI（"installs an arm64 version" 的 x64 包装），
      # 那等于给用户一个架构标识错误的安装包 —— 宁可不提供 arm64 MSI。
      # arm64 用户用 Setup-arm64.exe（NSIS，原生支持 arm64）或 portable-arm64.exe。
      arch: [x64, ia32]
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # v1.4.1 修复：electron-builder 默认给 makensis 加 -WX（把警告当错误），
  # 但 NSIS 自带模板 + 我们的 installer-hooks.nsh 会产生结构性 60xx 警告
  # （6020：uninstaller 脚本里定义了 un.xxx 函数但 electron-builder 的
  #  WriteUninstaller 生成逻辑在某些 target 下未调用；6010/6000 同理）。
  # 这些警告**不影响产物正确性**（图标/卸载器实际都由 electron-builder
  # 模板正常生成），硬开 -WX 只会让每次给 .nsh 加函数都炸构建。
  # 关闭 warningsAsErrors 让 makensis 正常把警告输出到日志、不中止构建。
  warningsAsErrors: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # 架构标识：x86 / x64 / arm64（WINSHARE_ARCH_LABEL 由 scripts/build-win.mjs 注入；
  # 直接裸跑 electron-builder 会因该变量未定义而明确报错，而不是产出错命名）
  artifactName: WinShare.Panel-${version}-Setup-${env.WINSHARE_ARCH_LABEL}.${ext}
  # v1.4.0：安装器"注册项"完善（仅 NSIS 安装包启用；portable/msi 不写这些注册项）：
  #   ① AddNoShortcuts/NoChange 默认值：createDesktopShortcut/StartMenuShortcut 仍生效
  #   ② 安装器侧写入 HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\WinSharePanel
  #      （AppId/DisplayName/DisplayIcon/UninstallString/QuietUninstallString/
  #       DisplayVersion/Publisher/InstallLocation/NoModify/NoRepair）—— 控制面板
  #      "程序和功能"列表可识别、可卸载
  #   ③ 安装器侧写入 HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\WinSharePanel
  #      = "<安装目录>\WinShare Panel.exe --silent"—— 登录快速启动（NSIS 卸载时自动清理）
  #   ④ 安装器侧写入 HKLM\SYSTEM\CurrentControlSet\Services\WinSharePanelSvc（预留）
  #      —— v1.4.0 暂不创建 Windows 服务（与 GUI 形态冲突），仅打日志说明预留点
  #   ⑤ 安装器侧把 <安装目录> 加到系统 PATH（HKLM\SYSTEM\...\Environment\Path）
  #      —— 用户可在 cmd / PowerShell 里直接调用 `WinSharePanel.exe`，可选，默认不勾选
  # ②③④⑤ 都在 resources/installer-hooks.nsh（NSIS 脚本）实现；electron-builder
  # 通过 nsis.include（单个 .nsh 文件）注入。v1.4.0 先用最小可运行集（②③），④⑤ 走
  # 主进程内"首次启动自检 + 一键注册"入口（避免 NSIS 跨权限写系统 PATH 失败风险）
  include: resources/installer-hooks.nsh
  # 让 ② 的 ARP 条目在"程序和功能"里正确显示版本
  differentialPackage: false
portable:
  artifactName: WinShare.Panel-${version}-portable-${env.WINSHARE_ARCH_LABEL}.${ext}
msi:
  oneClick: false
  artifactName: WinShare.Panel-${version}-${env.WINSHARE_ARCH_LABEL}.${ext}
